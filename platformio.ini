; PlatformIO Project Configuration for ROBO Race Bot Wireless
; Master Configuration for Robot Receiver and Remote Controller

[platformio]
default_envs = esp32_s3_bot_rx, esp32_remote_tx

; ============================================================================
; Environment 1: Robot Receiver (ESP32-S3-WROOM-1U-N16)
; ============================================================================
[env:esp32_s3_bot_rx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
build_src_filter = +<firmware/esp_now_bot_rx/*> +<firmware/common/*>
lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8

; Native USB-C Serial / JTAG
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
; Environment 2: Handheld Remote Controller (Standard ESP32 DevKit V1)
; ============================================================================
[env:esp32_remote_tx]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<firmware/esp_now_remote_tx/*> +<firmware/common/*>
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
